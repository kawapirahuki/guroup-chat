<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>グループチャット</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans JP", sans-serif;
  background: #e9eef5;
}

.app {
  width: 100%;
  max-width: 700px;
  height: 100vh;
  margin: auto;
  background: white;
  display: flex;
  flex-direction: column;
}

/* ヘッダー */
header {
  background: #4f7cff;
  color: white;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

#status {
  margin-top: 5px;
  font-size: 13px;
}

.download-btn {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid white;
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
}

.download-btn:hover {
  background: rgba(255, 255, 255, 0.3);
}

/* グループ情報 */
.room-info {
  padding: 15px;
  background: #f7f8fa;
  border-bottom: 1px solid #ddd;
}

.room-code {
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 4px;
  color: #4f7cff;
  margin-top: 5px;
}

/* メッセージ */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  background: #f3f5f8;
}

.system {
  text-align: center;
  color: #888;
  font-size: 13px;
  margin: 12px;
}

.message {
  margin-bottom: 14px;
}

.message.mine {
  text-align: right;
}

.name {
  font-size: 12px;
  color: #666;
  margin-bottom: 3px;
}

.mine .name {
  text-align: right;
}

.bubble {
  display: inline-block;
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 15px;
  background: white;
  word-break: break-word;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  text-align: left;
}

.mine .bubble {
  background: #4f7cff;
  color: white;
}

/* サイコロ操作エリア */
.dice-area {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: #f0f4f8;
  border-top: 1px solid #ddd;
  font-size: 14px;
}

.dice-area select {
  padding: 6px 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: white;
  font-size: 14px;
  outline: none;
}

.dice-btn {
  padding: 6px 12px;
  border: none;
  border-radius: 8px;
  background: #ff9800;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.dice-btn:disabled {
  background: #ccc;
  cursor: not-allowed;
}

/* 入力 */
.input-area {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #eee;
}

#messageInput {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #ccc
